<div class="hero relative overflow-hidden">
  <div class="slide relative h-96 md:h-[500px] lg:h-[600px] flex items-center justify-center"
       [style.backgroundImage]="'url(' + currentSlide.image + ')'"
       [style.color]="'var(--hero-text, #ffffff)'"
       style="background-size:cover;background-position:center;">
    <div class="absolute inset-0" 
         [style.background-color]="'var(--color-primary-600, #000000)'"
         [style.opacity]="'var(--hero-overlay-opacity, 0.4)'"></div>
    <div class="relative z-10 text-center px-4 py-8 max-w-4xl mx-auto">
      <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold mb-4 leading-tight">{{ currentSlide.title }}</h1>
      <p class="text-lg md:text-xl lg:text-2xl mb-8 opacity-90 max-w-2xl mx-auto leading-relaxed">{{ currentSlide.subtitle }}</p>
      <button (click)="onButtonClick()"
              aria-label="Ação principal do destaque"
              class="inline-flex items-center px-8 py-4 text-lg font-semibold rounded-full shadow-lg hover:shadow-xl transition-all duration-300 transform hover:scale-105 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2">
        {{ currentSlide.buttonText }}
        <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
        </svg>
      </button>
    </div>
  </div>
  <!-- Slide indicators removed temporarily to fix compilation -->
</div>
