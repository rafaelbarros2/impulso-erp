<div class="theme-selector bg-white p-6 rounded-lg shadow-lg">
  <!-- Loading indicator -->
  <div *ngIf="isLoading()" class="flex items-center justify-center p-4">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
    <span class="ml-2 text-gray-600">Carregando...</span>
  </div>

  <!-- Header -->
  <div class="mb-6">
    <h3 class="text-lg font-semibold text-gray-900 mb-2">Personalizar Tema</h3>
    <p class="text-sm text-gray-600">
      Tema atual: <strong>{{ currentTheme() | titlecase }}</strong>
      <span *ngIf="dynamicStylesState().isLoaded" class="ml-2 text-green-600">✓ Backend conectado</span>
      <span *ngIf="dynamicStylesState().error" class="ml-2 text-red-600">⚠ Erro: {{ dynamicStylesState().error }}</span>
    </p>
  </div>

  <!-- Theme Selection -->
  <div class="mb-6">
    <h4 class="text-md font-medium text-gray-800 mb-3">Temas Predefinidos</h4>
    <div class="flex flex-wrap gap-2">
      <button
        *ngFor="let theme of themes"
        [class]="'px-4 py-2 rounded-md border text-sm transition-colors ' + 
                 (theme === currentTheme() 
                   ? 'border-blue-500 bg-blue-50 text-blue-700' 
                   : 'border-gray-300 bg-white text-gray-700 hover:bg-gray-100')"
        (click)="onSelectTheme(theme)"
        [disabled]="isLoading()">
        {{ theme | titlecase }}
      </button>
    </div>
  </div>

  <!-- Color Customization -->
  <div class="mb-6">
    <h4 class="text-md font-medium text-gray-800 mb-3">Personalizar Cores</h4>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-4">
      <!-- Primary Color -->
      <div class="color-control">
        <label class="block text-sm font-medium text-gray-700 mb-1">Cor Primária</label>
        <div class="flex items-center space-x-2">
          <input 
            type="color" 
            [value]="currentColors().primary"
            (input)="onColorChange('primary', $any($event.target).value)"
            class="w-8 h-8 rounded border cursor-pointer">
          <input 
            type="text" 
            [value]="currentColors().primary"
            (input)="onColorChange('primary', $any($event.target).value)"
            class="flex-1 px-2 py-1 border rounded text-sm"
            placeholder="#3B82F6">
        </div>
      </div>

      <!-- Secondary Color -->
      <div class="color-control">
        <label class="block text-sm font-medium text-gray-700 mb-1">Cor Secundária</label>
        <div class="flex items-center space-x-2">
          <input 
            type="color" 
            [value]="currentColors().secondary"
            (input)="onColorChange('secondary', $any($event.target).value)"
            class="w-8 h-8 rounded border cursor-pointer">
          <input 
            type="text" 
            [value]="currentColors().secondary"
            (input)="onColorChange('secondary', $any($event.target).value)"
            class="flex-1 px-2 py-1 border rounded text-sm"
            placeholder="#10B981">
        </div>
      </div>

      <!-- Accent Color -->
      <div class="color-control">
        <label class="block text-sm font-medium text-gray-700 mb-1">Cor de Destaque</label>
        <div class="flex items-center space-x-2">
          <input 
            type="color" 
            [value]="currentColors().accent"
            (input)="onColorChange('accent', $any($event.target).value)"
            class="w-8 h-8 rounded border cursor-pointer">
          <input 
            type="text" 
            [value]="currentColors().accent"
            (input)="onColorChange('accent', $any($event.target).value)"
            class="flex-1 px-2 py-1 border rounded text-sm"
            placeholder="#F59E0B">
        </div>
      </div>

      <!-- Success Color -->
      <div class="color-control">
        <label class="block text-sm font-medium text-gray-700 mb-1">Sucesso</label>
        <div class="flex items-center space-x-2">
          <input 
            type="color" 
            [value]="currentColors().success"
            (input)="onColorChange('success', $any($event.target).value)"
            class="w-8 h-8 rounded border cursor-pointer">
          <input 
            type="text" 
            [value]="currentColors().success"
            (input)="onColorChange('success', $any($event.target).value)"
            class="flex-1 px-2 py-1 border rounded text-sm"
            placeholder="#059669">
        </div>
      </div>

      <!-- Warning Color -->
      <div class="color-control">
        <label class="block text-sm font-medium text-gray-700 mb-1">Aviso</label>
        <div class="flex items-center space-x-2">
          <input 
            type="color" 
            [value]="currentColors().warning"
            (input)="onColorChange('warning', $any($event.target).value)"
            class="w-8 h-8 rounded border cursor-pointer">
          <input 
            type="text" 
            [value]="currentColors().warning"
            (input)="onColorChange('warning', $any($event.target).value)"
            class="flex-1 px-2 py-1 border rounded text-sm"
            placeholder="#D97706">
        </div>
      </div>

      <!-- Danger Color -->
      <div class="color-control">
        <label class="block text-sm font-medium text-gray-700 mb-1">Erro/Perigo</label>
        <div class="flex items-center space-x-2">
          <input 
            type="color" 
            [value]="currentColors().danger"
            (input)="onColorChange('danger', $any($event.target).value)"
            class="w-8 h-8 rounded border cursor-pointer">
          <input 
            type="text" 
            [value]="currentColors().danger"
            (input)="onColorChange('danger', $any($event.target).value)"
            class="flex-1 px-2 py-1 border rounded text-sm"
            placeholder="#DC2626">
        </div>
      </div>
    </div>

    <!-- Preview Toggle -->
    <div class="flex items-center mb-4">
      <label class="flex items-center cursor-pointer">
        <input 
          type="checkbox" 
          [checked]="isPreviewMode()"
          (change)="togglePreview()"
          class="mr-2">
        <span class="text-sm text-gray-700">
          Modo Preview 
          <span class="text-xs text-gray-500">(aplicar mudanças temporariamente)</span>
        </span>
      </label>
    </div>

    <!-- Action Buttons -->
    <div class="flex flex-wrap gap-2">
      <button
        (click)="saveColors()"
        [disabled]="isLoading()"
        class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed text-sm">
        Salvar Cores
      </button>

      <button
        (click)="resetToDefault()"
        [disabled]="isLoading()"
        class="px-4 py-2 bg-gray-600 text-white rounded hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed text-sm">
        Resetar Padrão
      </button>

      <button
        (click)="reloadStyles()"
        [disabled]="isLoading()"
        class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 disabled:opacity-50 disabled:cursor-not-allowed text-sm">
        Recarregar
      </button>
    </div>
  </div>

  <!-- Advanced Options -->
  <div class="border-t pt-4">
    <h4 class="text-md font-medium text-gray-800 mb-3">Opções Avançadas</h4>
    
    <div class="flex flex-wrap gap-2">
      <button
        (click)="loadColorsOnly()"
        class="px-3 py-1 bg-blue-100 text-blue-700 rounded text-xs hover:bg-blue-200">
        Carregar Cores
      </button>

      <button
        (click)="loadShoppingStyles()"
        class="px-3 py-1 bg-purple-100 text-purple-700 rounded text-xs hover:bg-purple-200">
        Estilos E-commerce
      </button>

      <button
        (click)="checkActiveStyles()"
        class="px-3 py-1 bg-gray-100 text-gray-700 rounded text-xs hover:bg-gray-200">
        Verificar Status
      </button>
    </div>
  </div>

  <!-- Color Preview -->
  <div class="mt-6 border-t pt-4">
    <h4 class="text-md font-medium text-gray-800 mb-3">Preview das Cores</h4>
    <div class="flex flex-wrap gap-2">
      <div class="flex items-center space-x-2">
        <div class="w-4 h-4 rounded" [style.backgroundColor]="currentColors().primary"></div>
        <span class="text-xs text-gray-600">Primária</span>
      </div>
      <div class="flex items-center space-x-2">
        <div class="w-4 h-4 rounded" [style.backgroundColor]="currentColors().secondary"></div>
        <span class="text-xs text-gray-600">Secundária</span>
      </div>
      <div class="flex items-center space-x-2">
        <div class="w-4 h-4 rounded" [style.backgroundColor]="currentColors().accent"></div>
        <span class="text-xs text-gray-600">Destaque</span>
      </div>
      <div class="flex items-center space-x-2">
        <div class="w-4 h-4 rounded" [style.backgroundColor]="currentColors().success"></div>
        <span class="text-xs text-gray-600">Sucesso</span>
      </div>
      <div class="flex items-center space-x-2">
        <div class="w-4 h-4 rounded" [style.backgroundColor]="currentColors().warning"></div>
        <span class="text-xs text-gray-600">Aviso</span>
      </div>
      <div class="flex items-center space-x-2">
        <div class="w-4 h-4 rounded" [style.backgroundColor]="currentColors().danger"></div>
        <span class="text-xs text-gray-600">Erro</span>
      </div>
    </div>
  </div>
</div>
