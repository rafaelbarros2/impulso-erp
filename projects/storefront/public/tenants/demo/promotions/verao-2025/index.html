<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width, initial-scale=1'/><title>Campanha Verão 2025</title><link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap' rel='stylesheet'/><style>:root{ --accent: var(--promo-accent, #2563eb);}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.hero{min-height:40vh;display:grid;place-items:center;color:#fff;background:linear-gradient(45deg,rgba(0,0,0,.4),rgba(0,0,0,.2)),var(--promo-hero-image,url("https://images.unsplash.com/photo-1445205170230-053b83016050?q=85&fm=jpg&w=1600")) center/cover no-repeat}.wrap{max-width:1200px;margin:0 auto;padding:2rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem}.card{position:relative;border:2px solid color-mix(in oklab,var(--accent) 20%,#fff);border-radius:.75rem;background:#fff;padding:1rem;box-shadow:0 6px 16px rgba(0,0,0,.08);cursor:pointer;overflow:hidden}.card::before{content:"";position:absolute;inset:0;background:var(--accent);transform:rotate(-2deg);z-index:-1}.badge{position:absolute;top:-10px;right:-6px;background:var(--accent);color:#fff;font-weight:800;font-size:.7rem;padding:.25rem .5rem;border-radius:999px;transform:rotate(12deg)}.cta{background:#fff;color:var(--accent);font-weight:800;padding:.6rem 1rem;border-radius:.75rem;border:2px solid color-mix(in oklab,var(--accent) 30%,#fff)}img{width:100%;height:140px;object-fit:cover;border-radius:.5rem}</style></head><body><section class='hero'><div class='wrap' style='text-align:center'><h1 style='font-size:clamp(28px,5vw,48px);margin:0'>Promoções de Verão</h1><p style='opacity:.9;margin:.75rem 0 1.25rem'>Escolha uma categoria ou veja todas</p><button class='cta' onclick="parent.postMessage({type:'promo:filter', category: null}, '*')">Ver todas</button></div></section><div class='wrap'><div class='grid'><div class='card' onclick="parent.postMessage({type:'promo:filter', category:'vestidos'}, '*')"><span class='badge'>OFERTA</span><img src='https://images.unsplash.com/photo-1595536422718-72a493914948?w=600' alt='Vestidos'/><h3>Vestidos</h3><small>Até 50% OFF</small></div><div class='card' onclick="parent.postMessage({type:'promo:filter', category:'calcados'}, '*')"><img src='https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=600' alt='Calçados'/><h3>Calçados</h3><small>Leve 3, pague 2</small></div><div class='card' onclick="parent.postMessage({type:'promo:filter', category:'blusas'}, '*')"><img src='https://images.unsplash.com/photo-1581044777550-4cfa6ce24c40?w=600' alt='Blusas'/><h3>Blusas & Tops</h3><small>A partir de R$49,90</small></div><div class='card' onclick="parent.postMessage({type:'promo:filter', category:'calcas'}, '*')"><img src='https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=600' alt='Calças'/><h3>Calças & Jeans</h3><small>20% na seção</small></div></div></div><script>const postHeight=()=>parent.postMessage({type:'remote:height',value:document.body.scrollHeight}, '*');window.addEventListener('load', postHeight);new ResizeObserver(postHeight).observe(document.body);</script></body></html>
