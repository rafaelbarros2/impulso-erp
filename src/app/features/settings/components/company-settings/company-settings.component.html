<div class="max-w-2xl">
  <div class="space-y-6">
    <div>
      <label for="company-name" class="block font-medium text-slate-700">Nome da Empresa</label>
      <input id="company-name" type="text" class="w-full p-2 mt-1 border rounded-md border-slate-300" value="Minha Loja Inc.">
    </div>
    <div>
      <label for="company-cnpj" class="block font-medium text-slate-700">CNPJ</label>
      <input id="company-cnpj" type="text" class="w-full p-2 mt-1 border rounded-md border-slate-300" value="00.000.000/0001-00">
    </div>
    <div>
      <label for="company-email" class="block font-medium text-slate-700">Email de Contacto</label>
      <input id="company-email" type="email" class="w-full p-2 mt-1 border rounded-md border-slate-300" value="contato@minhaloja.com">
    </div>
  </div>
  <div class="flex justify-end mt-8">
    <p-button label="Salvar Alterações" icon="pi pi-check"></p-button>
  </div>
</div>
