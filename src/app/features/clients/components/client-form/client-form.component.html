<div class="p-4 sm:p-6 lg:p-8 bg-gray-50 min-h-screen flex flex-col">
  <p-toast></p-toast>

  <h2 class="text-2xl sm:text-3xl font-bold text-gray-800 mb-6">{{ pageTitle() }}</h2>

  <!-- Container principal com scroll otimizado -->
  <div class="flex-1 overflow-auto">
    <p-card class="rounded-xl shadow-lg mb-4">
      <div [formGroup]="clientForm" class="grid grid-cols-1 md:grid-cols-2 gap-6 p-4">

        <!-- General validation errors -->
        <div *ngIf="generalErrors().length > 0" class="col-span-full">
          <div class="bg-red-50 border border-red-200 rounded-lg p-4">
            <div class="flex">
              <div class="ml-3">
                <h3 class="text-sm font-medium text-red-800">
                  Erros de validação encontrados:
                </h3>
                <div class="mt-2 text-sm text-red-700">
                  <ul class="list-disc pl-5 space-y-1">
                    <li *ngFor="let error of generalErrors()">{{ error }}</li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Coluna Esquerda (Mobile: topo, Desktop: esquerda) -->
        <div class="col-span-1 flex flex-col gap-6">
          <!-- Nome do Cliente -->
          <div class="p-field">
            <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
              Nome <span class="text-red-500">*</span>
            </label>
            <input 
              id="name" 
              type="text" 
              pInputText 
              formControlName="name" 
              class="w-full rounded-lg shadow-sm"
              [ngClass]="{'ng-invalid ng-dirty': hasFieldError('name')}" />
            <small *ngIf="hasFieldError('name')" class="p-error block mt-1">
              {{ getFieldError('name') }}
            </small>
          </div>

          <!-- Email -->
          <div class="p-field">
            <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
              Email <span class="text-red-500">*</span>
            </label>
            <input 
              id="email" 
              type="email" 
              pInputText 
              formControlName="email" 
              class="w-full rounded-lg shadow-sm"
              [ngClass]="{'ng-invalid ng-dirty': hasFieldError('email')}" />
            <small *ngIf="hasFieldError('email')" class="p-error block mt-1">
              {{ getFieldError('email') }}
            </small>
          </div>

          <!-- CPF/CNPJ -->
          <div class="p-field">
            <label for="cpfCnpj" class="block text-sm font-medium text-gray-700 mb-2">
              CPF/CNPJ <span class="text-red-500">*</span>
            </label>
            <input 
              id="cpfCnpj" 
              type="text" 
              pInputText 
              formControlName="cpfCnpj" 
              class="w-full rounded-lg shadow-sm"
              [ngClass]="{'ng-invalid ng-dirty': hasFieldError('cpfCnpj')}" />
            <small *ngIf="hasFieldError('cpfCnpj')" class="p-error block mt-1">
              {{ getFieldError('cpfCnpj') }}
            </small>
          </div>
        </div>

        <!-- Coluna Direita (Mobile: abaixo, Desktop: direita) -->
        <div class="col-span-1 flex flex-col gap-6">
          <!-- Telefone -->
          <div class="p-field">
            <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">
              Telefone
            </label>
            <input 
              id="phone" 
              type="text" 
              pInputText 
              formControlName="phone" 
              class="w-full rounded-lg shadow-sm"
              [ngClass]="{'ng-invalid ng-dirty': hasFieldError('phone')}" />
            <small *ngIf="hasFieldError('phone')" class="p-error block mt-1">
              {{ getFieldError('phone') }}
            </small>
          </div>

          <!-- Endereço -->
          <div class="p-field">
            <label for="address" class="block text-sm font-medium text-gray-700 mb-2">Endereço</label>
            <input 
              id="address" 
              type="text" 
              pInputText 
              formControlName="address" 
              class="w-full rounded-lg shadow-sm"
              [ngClass]="{'ng-invalid ng-dirty': hasFieldError('address')}" />
            <small *ngIf="hasFieldError('address')" class="p-error block mt-1">
              {{ getFieldError('address') }}
            </small>
          </div>
        </div>
      </div>
    </p-card>
  </div>

  <!-- Botões de Ação - Fixos na parte inferior -->
  <div class="flex-shrink-0 bg-gray-50 pt-4 pb-4">
    <div class="flex flex-col sm:flex-row justify-end gap-3">
      <p-button
        label="Cancelar"
        icon="pi pi-times"
        styleClass="p-button-secondary w-full sm:w-auto rounded-lg shadow-md"
        (onClick)="onCancel()"
        [disabled]="loading()"
        type="button">
      </p-button>
      <p-button
        [label]="isEditMode() ? 'Atualizar Cliente' : 'Salvar Cliente'"
        [icon]="loading() ? 'pi pi-spin pi-spinner' : 'pi pi-check'"
        styleClass="p-button-success w-full sm:w-auto rounded-lg shadow-md"
        (onClick)="onSaveClient()"
        [disabled]="loading()"
        type="button">
      </p-button>
    </div>
  </div>
</div>
