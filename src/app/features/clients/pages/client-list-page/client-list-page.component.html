<div class="p-4 sm:p-6 lg:p-8 bg-gray-50 min-h-screen">
  <p-toast></p-toast>
  <p-confirmDialog></p-confirmDialog>

  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-6">
    <h2 class="text-2xl sm:text-3xl font-bold text-gray-800 mb-4 sm:mb-0">Gestão de Clientes</h2>
    <div class="flex flex-col sm:flex-row gap-3 w-full sm:w-auto" style="text-align: end;">
      <p-iconfield class="w-full sm:w-auto">
        <p-inputicon class="pi pi-search" />
        <input pInputText type="text" [(ngModel)]="globalFilter" (input)="dt.filterGlobal(globalFilter, 'contains')" placeholder="Buscar cliente..." class="w-full rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500" />
      </p-iconfield>
      <p-button
        label="Adicionar Novo Cliente"
        icon="pi pi-plus"
        styleClass="p-button-primary w-full sm:w-auto rounded-lg shadow-md"
        (onClick)="onAddNewClient()"
      ></p-button>
    </div>
  </div>

  <!-- Loading Skeleton -->
  <div *ngIf="getLoadingService().isLoading(LOADING_KEYS.CLIENTS)" class="bg-white rounded-xl shadow-lg overflow-hidden">
    <app-skeleton-loader 
      type="table" 
      [rows]="10" 
      [columns]="6"
      [showHeader]="true">
    </app-skeleton-loader>
  </div>

  <!-- Error State -->
  <div *ngIf="hasError && !getLoadingService().isLoading(LOADING_KEYS.CLIENTS)" class="bg-white rounded-xl shadow-lg overflow-hidden">
    <app-empty-state
      [title]="EMPTY_STATES.ERROR_STATE.title"
      [description]="EMPTY_STATES.ERROR_STATE.description"
      [icon]="EMPTY_STATES.ERROR_STATE.icon"
      [theme]="EMPTY_STATES.ERROR_STATE.theme"
      [actionLabel]="EMPTY_STATES.ERROR_STATE.actionLabel"
      [actionIcon]="EMPTY_STATES.ERROR_STATE.actionIcon"
      (action)="onRetryLoad()">
    </app-empty-state>
  </div>

  <!-- Data Table -->
  <div *ngIf="!getLoadingService().isLoading(LOADING_KEYS.CLIENTS) && !hasError" class="bg-white rounded-xl shadow-lg overflow-hidden relative">
    <!-- Loading overlay for actions -->
    <app-loading-spinner
      [loadingKey]="LOADING_KEYS.DELETING_CLIENT"
      [overlay]="true"
      text="Excluindo cliente..."
      theme="primary">
    </app-loading-spinner>

    <p-table
      #dt
      [value]="clients"
      [paginator]="true"
      [rows]="10"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} clientes"
      [rowsPerPageOptions]="[10, 25, 50]"
      [globalFilterFields]="['name', 'document', 'phone', 'email', 'status']"
      [selection]="selectedClients"
      [(selection)]="selectedClients"
      [rowHover]="true"
      dataKey="id"
      styleClass="p-datatable-striped p-datatable-gridlines"
    >
      <ng-template pTemplate="caption">
        <div class="flex flex-col sm:flex-row items-center justify-between p-4 bg-gray-50 rounded-t-xl">
          <h3 class="text-lg font-semibold text-gray-700 mb-3 sm:mb-0">Lista Completa de Clientes</h3>
          <p-button
            *ngIf="selectedClients.length > 0"
            label="Excluir Selecionados"
            icon="pi pi-trash"
            styleClass="p-button-danger p-button-sm rounded-lg shadow-sm"
            (onClick)="deleteSelectedClients($event)"
          ></p-button>
        </div>
      </ng-template>

      <ng-template pTemplate="header">
        <tr>
          <th style="width: 3rem">
            <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
          </th>
          <th pSortableColumn="name" class="text-left">Nome <p-sortIcon field="name"></p-sortIcon></th>
          <th class="hidden sm:table-cell text-left">CPF/CNPJ</th>
          <th class="hidden md:table-cell text-left">Telefone</th>
          <th class="hidden lg:table-cell text-left">Email</th>
          <th pSortableColumn="status" class="hidden xl:table-cell text-left">Status <p-sortIcon field="status"></p-sortIcon></th>
          <th class="text-center">Ações</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-client>
        <tr>
          <td>
            <p-tableCheckbox [value]="client"></p-tableCheckbox>
          </td>
          <td class="font-medium text-gray-900">{{ client.name }}</td>
          <td class="hidden sm:table-cell text-gray-700">{{ client.cpfCnpj }}</td>
          <td class="hidden md:table-cell text-gray-700">{{ client.phone }}</td>
          <td class="hidden lg:table-cell text-gray-700">{{ client.email }}</td>
          <td class="hidden xl:table-cell">
            <p-tag [value]="client.status" [severity]="getSeverity(client.status)"></p-tag>
          </td>
          <td class="text-center">
            <p-button
              icon="pi pi-pencil"
              styleClass="p-button-text p-button-rounded p-button-sm text-blue-600 hover:bg-blue-100"
              (onClick)="onEditClient(client)"
              pTooltip="Editar" tooltipPosition="top"
            ></p-button>
            <p-button
              icon="pi pi-trash"
              styleClass="p-button-text p-button-rounded p-button-sm text-red-600 hover:bg-red-100 ml-1"
              (onClick)="onDeleteClient($event, client)"
              pTooltip="Excluir" tooltipPosition="top"
            ></p-button>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="7" class="p-0">
            <app-empty-state
              [title]="EMPTY_STATES.NO_CLIENTS.title"
              [description]="EMPTY_STATES.NO_CLIENTS.description"
              [icon]="EMPTY_STATES.NO_CLIENTS.icon"
              [actionLabel]="EMPTY_STATES.NO_CLIENTS.actionLabel"
              [actionIcon]="EMPTY_STATES.NO_CLIENTS.actionIcon"
              size="sm"
              (action)="onAddNewClient()">
            </app-empty-state>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="summary">
        <div class="flex items-center justify-end p-4 bg-gray-50 rounded-b-xl">
          Total de {{ clients ? clients.length : 0 }} clientes.
        </div>
      </ng-template>
    </p-table>
  </div>
</div>
