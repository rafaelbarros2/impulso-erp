    <div class="cart-container">
        <div class="cart-header">
            <h1 class="cart-title">Meu Carrinho</h1>
        </div>

        <div class="cart-content-desktop">
            <!-- Left Column: Cart Items -->
            <div class="cart-items-list" *ngIf="cartData.length > 0">
                <!-- Item do carrinho 1 -->
                <div class="cart-item" *ngFor="let item of cartData; let i = index">
                    <img [src]="item.image" [alt]="item.name" class="item-image">
                    <div class="item-info">
                        <p class="item-name">{{ item.name }}</p>
                        <p class="item-price">{{ item.price | currency:'BRL':'symbol':'1.2-2':'pt' }}</p>
                    </div>
                    <div class="item-actions">
                        <button class="qty-button" (click)="updateQuantity(i, item.quantity - 1)">
                            <i class="pi pi-minus text-gray-500"></i>
                        </button>
                        <span class="qty-display">{{ item.quantity }}</span>
                        <button class="qty-button" (click)="updateQuantity(i, item.quantity + 1)">
                            <i class="pi pi-plus text-gray-500"></i>
                        </button>
                        <button class="remove-button" (click)="removeItem(i)">
                            <i class="pi pi-trash"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right Column: Summary -->
            <div class="cart-summary" *ngIf="cartData.length > 0">
                <div class="summary-row">
                    <span class="text-lg text-gray-600">Subtotal:</span>
                    <span class="text-lg font-semibold text-gray-800">{{ subtotal | currency:'BRL':'symbol':'1.2-2':'pt' }}</span>
                </div>
                <div class="summary-row">
                    <span class="text-lg text-gray-600">Desconto:</span>
                    <input type="text" placeholder="Código de desconto" class="w-48 text-right border rounded-md px-2 py-1">
                </div>
                <div class="summary-row">
                    <span class="text-xl font-bold text-gray-800">Total:</span>
                    <span class="text-2xl font-bold text-green-600">{{ total | currency:'BRL':'symbol':'1.2-2':'pt' }}</span>
                </div>
                <button class="continue-shopping-button">Continuar Comprando</button>
                <button class="checkout-button">Finalizar Compra</button>
            </div>

            <!-- Empty Cart State -->
            <div class="empty-cart-state" *ngIf="cartData.length === 0">
                <i class="pi pi-shopping-cart text-5xl text-gray-400 mb-4"></i>
                <h2 class="text-2xl font-semibold text-gray-700 mb-2">Seu carrinho está vazio</h2>
                <p class="text-gray-500">Adicione produtos para continuar.</p>
                <button class="continue-shopping-button mt-6">Explorar Produtos</button>
            </div>
        </div>
    </div>
