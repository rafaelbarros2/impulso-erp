<!-- Background Selector Container -->
<div class="background-selector flex items-center gap-3 flex-wrap">
  
  <!-- Label -->
  <span class="text-sm font-medium text-gray-700 whitespace-nowrap">
    Fundo:
  </span>
  
  <!-- Background Dropdown -->
  <p-dropdown
    [options]="backgroundOptions"
    [ngModel]="selectedBackground()"
    (onChange)="onBackgroundChange($event)"
    optionLabel="label"
    placeholder="Selecione um fundo"
    [style]="{ 'min-width': '180px' }"
    styleClass="background-dropdown"
    [showClear]="false"
    [disabled]="isApplying()">
    
    <!-- Template para item selecionado -->
    <ng-template pTemplate="selectedItem">
      <div class="flex items-center gap-2" *ngIf="selectedBackground()">
        <i [class]="selectedBackground()?.icon" class="text-blue-600"></i>
        <span class="font-medium">{{ selectedBackground()?.label }}</span>
        <i class="pi pi-spin pi-spinner text-xs" *ngIf="isApplying()"></i>
      </div>
    </ng-template>
    
    <!-- Template para itens no dropdown -->
    <ng-template let-option pTemplate="item">
      <div class="flex items-center gap-3 py-2 px-1">
        <i [class]="option.icon" class="text-blue-600 flex-shrink-0"></i>
        <div class="flex flex-col">
          <span class="font-medium text-gray-900">{{ option.label }}</span>
          <span class="text-xs text-gray-500">{{ option.description }}</span>
        </div>
      </div>
    </ng-template>
  </p-dropdown>

  <!-- Custom Background Controls -->
  <div class="custom-bg-controls flex items-center gap-2" 
       *ngIf="showCustomControls()"
       [@slideIn]>
    
    <!-- Custom Input -->
    <p-inputText
      [ngModel]="customBackgroundValue()"
      (input)="onCustomValueChange($event)"
      placeholder="URL da imagem ou cor hex"
      [style]="{ 'width': '200px' }"
      styleClass="custom-bg-input"
      [disabled]="isApplying()"
      (keyup.enter)="applyCustomBackground()">
    </p-inputText>
    
    <!-- Apply Custom Background Button -->
    <p-button
      icon="pi pi-check"
      [disabled]="!isCustomValueValid() || isApplying()"
      (onClick)="applyCustomBackground()"
      styleClass="p-button-success p-button-sm"
      pTooltip="Aplicar fundo personalizado"
      tooltipPosition="top"
      [loading]="isApplying()">
    </p-button>
  </div>

  <!-- Background Controls -->
  <div class="bg-controls flex items-center gap-2">
    
    <!-- Overlay Toggle -->
    <p-button
      [icon]="overlayToggleIcon()"
      [disabled]="!hasBackgroundApplied()"
      (onClick)="toggleOverlay()"
      [styleClass]="overlayEnabled() ? 'p-button-info p-button-sm' : 'p-button-outlined p-button-sm'"
      [pTooltip]="overlayToggleTooltip()"
      tooltipPosition="top">
    </p-button>
    
    <!-- Clear Background Button -->
    <p-button
      icon="pi pi-refresh"
      [disabled]="!hasBackgroundApplied() || isApplying()"
      (onClick)="clearBackground()"
      styleClass="p-button-outlined p-button-sm"
      pTooltip="Restaurar fundo padrão"
      tooltipPosition="top">
    </p-button>
  </div>

  <!-- Background Info -->
  <div class="bg-info" *ngIf="currentBackground() && currentBackground()?.id !== 'default'">
    <p-chip 
      [label]="currentBackground()?.name" 
      styleClass="bg-info-chip"
      [removable]="false">
      <ng-template pTemplate="icon">
        <i class="pi pi-info-circle"></i>
      </ng-template>
    </p-chip>
  </div>

  <!-- DEBUG CONTROLS (REMOVER EM PRODUÇÃO) -->
  <div class="debug-controls flex items-center gap-1 ml-4 p-2 bg-gray-100 rounded-lg border" 
       style="border: 2px dashed orange; background: rgba(255, 165, 0, 0.1);">
    
    <span class="text-xs font-bold text-orange-600">DEBUG:</span>
    
    <!-- Debug Button -->
    <p-button
      icon="pi pi-bug"
      (onClick)="debugBackground()"
      styleClass="p-button-warning p-button-sm p-button-text"
      pTooltip="Debug no console"
      tooltipPosition="top">
    </p-button>
    
    <!-- Force Test Background -->
    <p-button
      icon="pi pi-image"
      (onClick)="forceTestBackground()"
      styleClass="p-button-help p-button-sm p-button-text"
      pTooltip="Força background de teste"
      tooltipPosition="top">
    </p-button>
    
    <!-- Clear All -->
    <p-button
      icon="pi pi-trash"
      (onClick)="clearAllBackgrounds()"
      styleClass="p-button-danger p-button-sm p-button-text"
      pTooltip="Remove todos os backgrounds"
      tooltipPosition="top">
    </p-button>
  </div>
</div>

<!-- Mobile Layout (aparece apenas em telas pequenas) -->
<div class="background-selector-mobile md:hidden">
  
  <!-- Header com label -->
  <div class="flex items-center justify-between mb-2">
    <span class="text-sm font-medium text-gray-700">Personalizar Fundo</span>
    <div class="flex gap-1">
      <p-button
        icon="pi pi-refresh"
        [disabled]="!hasBackgroundApplied()"
        (onClick)="clearBackground()"
        styleClass="p-button-text p-button-sm"
        pTooltip="Restaurar padrão">
      </p-button>
      <!-- Mobile Debug -->
      <p-button
        icon="pi pi-bug"
        (onClick)="debugBackground()"
        styleClass="p-button-warning p-button-sm p-button-text"
        pTooltip="Debug">
      </p-button>
    </div>
  </div>
  
  <!-- Dropdown -->
  <div class="mb-3">
    <p-dropdown
      [options]="backgroundOptions"
      [ngModel]="selectedBackground()"
      (onChange)="onBackgroundChange($event)"
      optionLabel="label"
      placeholder="Selecione um fundo"
      [style]="{ 'width': '100%' }"
      styleClass="background-dropdown-mobile"
      [disabled]="isApplying()">
      
      <ng-template pTemplate="selectedItem">
        <div class="flex items-center gap-2" *ngIf="selectedBackground()">
          <i [class]="selectedBackground()?.icon" class="text-blue-600"></i>
          <span class="font-medium">{{ selectedBackground()?.label }}</span>
          <i class="pi pi-spin pi-spinner text-xs" *ngIf="isApplying()"></i>
        </div>
      </ng-template>
      
      <ng-template let-option pTemplate="item">
        <div class="flex items-center gap-3 py-2">
          <i [class]="option.icon" class="text-blue-600"></i>
          <div>
            <div class="font-medium">{{ option.label }}</div>
            <div class="text-xs text-gray-500">{{ option.description }}</div>
          </div>
        </div>
      </ng-template>
    </p-dropdown>
  </div>
  
  <!-- Custom Controls -->
  <div class="custom-controls" *ngIf="showCustomControls()" [@slideIn]>
    <div class="flex gap-2 mb-2">
      <p-inputText
        [ngModel]="customBackgroundValue()"
        (input)="onCustomValueChange($event)"
        placeholder="URL ou código CSS"
        [style]="{ 'flex': '1' }"
        styleClass="custom-bg-input-mobile"
        [disabled]="isApplying()">
      </p-inputText>
      <p-button
        icon="pi pi-check"
        [disabled]="!isCustomValueValid() || isApplying()"
        (onClick)="applyCustomBackground()"
        styleClass="p-button-success"
        [loading]="isApplying()">
      </p-button>
    </div>
  </div>
  
  <!-- Toggle Controls -->
  <div class="flex items-center justify-between" *ngIf="hasBackgroundApplied()">
    <span class="text-sm text-gray-600">Overlay:</span>
    <p-inputSwitch
      [ngModel]="overlayEnabled()"
      (onChange)="onOverlayChange($event)">
    </p-inputSwitch>
  </div>
  
  <!-- Mobile Debug Panel -->
  <div class="mt-3 p-2 bg-orange-50 border border-orange-200 rounded-lg">
    <div class="text-xs text-orange-600 font-bold mb-1">Debug Mobile:</div>
    <div class="flex gap-1">
      <p-button
        label="Teste"
        icon="pi pi-image"
        (onClick)="forceTestBackground()"
        styleClass="p-button-help p-button-sm">
      </p-button>
      <p-button
        label="Limpar"
        icon="pi pi-trash"
        (onClick)="clearAllBackgrounds()"
        styleClass="p-button-danger p-button-sm">
      </p-button>
    </div>
  </div>
</div>

<!-- Status Indicator -->
<div class="status-indicator fixed bottom-4 left-4 z-50" *ngIf="isApplying()">
  <div class="bg-blue-500 text-white px-3 py-2 rounded-lg shadow-lg flex items-center gap-2">
    <i class="pi pi-spin pi-spinner"></i>
    <span class="text-sm font-medium">Aplicando fundo...</span>
  </div>
</div>
