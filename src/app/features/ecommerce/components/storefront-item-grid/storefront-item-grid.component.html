<!-- Container Principal -->
<div class="storefront-item-grid w-full" 
     [attr.data-layout]="currentLayout"
     [attr.data-theme]="currentTheme?.id">

  <!-- Loading State -->
  <div *ngIf="loading" 
       class="loading-container flex items-center justify-center py-16">
    <div class="loading-content text-center">
      <div class="loading-spinner w-12 h-12 border-4 border-gray-200 border-t-blue-500 rounded-full animate-spin mx-auto mb-4"></div>
      <p class="text-gray-600 text-lg">Carregando produtos...</p>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="!loading && products.length === 0" 
       class="empty-container flex items-center justify-center py-16">
    <div class="empty-content text-center max-w-md mx-auto">
      <div class="empty-icon text-6xl text-gray-300 mb-4">
        🛍️
      </div>
      <h3 class="text-xl font-semibold text-gray-700 mb-2">
        Nenhum produto encontrado
      </h3>
      <p class="text-gray-500">
        Não encontramos produtos que correspondem aos seus critérios de busca.
      </p>
    </div>
  </div>

  <!-- Products Grid -->
  <div *ngIf="!loading && products.length > 0"
       [ngClass]="gridClasses"
       [ngStyle]="gridStyle"
       class="products-container">
    
    <!-- Product Card -->
    <div *ngFor="let product of products; trackBy: trackByProductId"
         class="product-item"
         [attr.data-product-id]="product.id"
         [attr.data-category]="product.category">
      
      <app-storefront-item-card
        [product]="product"
        [layout]="productLayoutType"
        [showActions]="showActions"
        [showRating]="shouldShowRating"
        [showDescription]="shouldShowDescription"
        (productClick)="onProductClick($event)"
        (addToCart)="onAddToCart($event)"
        (favorite)="onFavoriteToggle($event)"
        (compare)="onCompareProduct($event)"
        (quickView)="onQuickView($event)">
      </app-storefront-item-card>
    </div>
  </div>

  <!-- Grid Info Debug (Development only) -->
  <div *ngIf="!loading && products.length > 0" 
       class="grid-debug-info mt-8 p-4 bg-gray-100 rounded-lg text-sm text-gray-600"
       style="display: none;" 
       id="gridDebugInfo">
    <h4 class="font-semibold mb-2">Grid Debug Info:</h4>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
      <div>
        <strong>Layout:</strong> {{ currentLayout }}
      </div>
      <div>
        <strong>Tema:</strong> {{ currentTheme?.name }}
      </div>
      <div>
        <strong>Produtos:</strong> {{ products.length }}
      </div>
      <div>
        <strong>Em Destaque:</strong> {{ featuredProducts.length }}
      </div>
    </div>
  </div>

  <!-- Grid Stats (Optional)
  <div *ngIf="!loading && products.length > 0" 
       class="grid-stats mt-6 flex flex-wrap items-center justify-between text-sm text-gray-500 border-t pt-4">
    
    <div class="stats-left flex items-center space-x-4">
      <span>{{ products.length }} produto(s) encontrado(s)</span>
      <span *ngIf="featuredProducts.length > 0">
        • {{ featuredProducts.length }} em destaque
      </span>
      <span *ngIf="saleProducts.length > 0">
        • {{ saleProducts.length }} em promoção
      </span>
    </div>

    <div class="stats-right flex items-center space-x-2">
      <span class="layout-indicator">
        Layout: <strong>{{ currentLayout === 'grid' ? 'Grade' : 'Minimal' }}</strong>
      </span>
    </div>
  </div> -->
</div>

<!-- Floating Action Button (Optional) -->
<div class="floating-actions fixed bottom-6 right-6 z-50 flex flex-col space-y-2">
  <!-- Scroll to Top -->
  <button class="fab-button bg-blue-500 hover:bg-blue-600 text-white w-12 h-12 rounded-full shadow-lg transition-all duration-200 hover:scale-110 flex items-center justify-center"
          title="Voltar ao topo"
          (click)="scrollToTop()">
    <i class="pi pi-angle-up text-lg"></i>
  </button>

  <!-- Refresh Grid -->
  <button class="fab-button bg-gray-500 hover:bg-gray-600 text-white w-12 h-12 rounded-full shadow-lg transition-all duration-200 hover:scale-110 flex items-center justify-center"
          title="Atualizar grid"
          (click)="refreshGrid()">
    <i class="pi pi-refresh text-lg"></i>
  </button>
</div>
