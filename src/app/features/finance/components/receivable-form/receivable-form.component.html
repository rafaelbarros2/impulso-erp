<div class="p-4 sm:p-6 lg:p-8 bg-gray-50 min-h-screen flex flex-col">
  <p-toast></p-toast>

  <h2 class="text-2xl sm:text-3xl font-bold text-gray-800 mb-6">{{ pageTitle }}</h2>

  <p-card class="rounded-xl shadow-lg flex-grow overflow-auto">
    <form [formGroup]="receivableForm" (ngSubmit)="onSaveReceivable()" class="grid grid-cols-1 md:grid-cols-2 gap-6 p-4">

      <!-- Coluna Esquerda -->
      <div class="col-span-1 flex flex-col gap-6">
        <!-- Descrição -->
        <div class="p-field">
          <label for="description" class="block text-sm font-medium text-gray-700 mb-2">Descrição <span class="text-red-500">*</span></label>
          <input id="description" type="text" pInputText formControlName="description" class="w-full rounded-lg shadow-sm"
                 [ngClass]="{'ng-invalid ng-dirty': receivableForm.get('description')?.invalid && receivableForm.get('description')?.touched}" />
          <small *ngIf="receivableForm.get('description')?.invalid && receivableForm.get('description')?.touched" class="p-error block mt-1">
            Descrição é obrigatória.
          </small>
        </div>

        <!-- Cliente -->
        <div class="p-field">
          <label for="client" class="block text-sm font-medium text-gray-700 mb-2">Cliente <span class="text-red-500">*</span></label>
          <p-dropdown id="client" [options]="clients" formControlName="client" optionLabel="name" placeholder="Selecione um Cliente"
                      [filter]="true" filterBy="name" class="w-full" [style]="{'width': '100%'}"
                      [ngClass]="{'ng-invalid ng-dirty': receivableForm.get('client')?.invalid && receivableForm.get('client')?.touched}"></p-dropdown>
          <small *ngIf="receivableForm.get('client')?.invalid && receivableForm.get('client')?.touched" class="p-error block mt-1">
            Cliente é obrigatório.
          </small>
        </div>

        <!-- Valor -->
        <div class="p-field">
          <label for="amount" class="block text-sm font-medium text-gray-700 mb-2">Valor <span class="text-red-500">*</span></label>
          <p-inputNumber id="amount" formControlName="amount" mode="currency" currency="BRL" locale="pt-BR"
                         [min]="0.01" class="w-full" inputStyleClass="w-full rounded-lg shadow-sm"
                         [ngClass]="{'ng-invalid ng-dirty': receivableForm.get('amount')?.invalid && receivableForm.get('amount')?.touched}"></p-inputNumber>
          <small *ngIf="receivableForm.get('amount')?.invalid && receivableForm.get('amount')?.touched" class="p-error block mt-1">
            Valor é obrigatório e deve ser maior que zero.
          </small>
        </div>

        <!-- Data de Vencimento -->
        <div class="p-field">
          <label for="dueDate" class="block text-sm font-medium text-gray-700 mb-2">Data de Vencimento <span class="text-red-500">*</span></label>
          <p-calendar id="dueDate" formControlName="dueDate" dateFormat="dd/mm/yy" [showIcon]="true"
                      class="w-full" inputStyleClass="w-full rounded-lg shadow-sm"
                      [ngClass]="{'ng-invalid ng-dirty': receivableForm.get('dueDate')?.invalid && receivableForm.get('dueDate')?.touched}"></p-calendar>
          <small *ngIf="receivableForm.get('dueDate')?.invalid && receivableForm.get('dueDate')?.touched" class="p-error block mt-1">
            Data de vencimento é obrigatória.
          </small>
        </div>
      </div>

      <!-- Coluna Direita -->
      <div class="col-span-1 flex flex-col gap-6">
        <!-- Status -->
        <div class="p-field">
          <label for="status" class="block text-sm font-medium text-gray-700 mb-2">Status <span class="text-red-500">*</span></label>
          <p-dropdown id="status" [options]="statusOptions" formControlName="status" optionLabel="label" placeholder="Selecione o Status"
                      class="w-full" [style]="{'width': '100%'}"
                      [ngClass]="{'ng-invalid ng-dirty': receivableForm.get('status')?.invalid && receivableForm.get('status')?.touched}"></p-dropdown>
          <small *ngIf="receivableForm.get('status')?.invalid && receivableForm.get('status')?.touched" class="p-error block mt-1">
            Status é obrigatório.
          </small>
        </div>

        <!-- Data de Pagamento (Condicional) -->
        <div class="p-field">
          <label for="paymentDate" class="block text-sm font-medium text-gray-700 mb-2">Data de Pagamento</label>
          <p-calendar id="paymentDate" formControlName="paymentDate" dateFormat="dd/mm/yy" [showIcon]="true"
                      class="w-full" inputStyleClass="w-full rounded-lg shadow-sm"></p-calendar>
          <small class="block mt-1 text-gray-500">
            Preencha apenas se o status for "Recebido".
          </small>
        </div>

        <!-- Observações -->
        <div class="p-field">
          <label for="notes" class="block text-sm font-medium text-gray-700 mb-2">Observações</label>
          <textarea id="notes" pInputTextarea formControlName="notes" rows="3" class="w-full rounded-lg shadow-sm"></textarea>
        </div>
      </div>

      <!-- Botões de Ação -->
      <div class="col-span-1 md:col-span-2 flex flex-col sm:flex-row justify-end gap-3 mt-6">
        <p-button
          label="Cancelar"
          icon="pi pi-times"
          styleClass="p-button-secondary w-full sm:w-auto rounded-lg shadow-md"
          (onClick)="onCancel()"
          type="button"
        ></p-button>
        <p-button
          [label]="isEditMode ? 'Atualizar Recebível' : 'Salvar Recebível'"
          icon="pi pi-check"
          styleClass="p-button-success w-full sm:w-auto rounded-lg shadow-md"
          type="submit"
        ></p-button>
      </div>
    </form>
  </p-card>
</div>
