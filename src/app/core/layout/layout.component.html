<div class="flex flex-col h-screen">
  <app-top-bar></app-top-bar>
  <div class="grid flex-grow w-full transition-all duration-300 ease-in-out" 
       [ngClass]="isSidebarCollapsed ? 'grid-cols-[88px_1fr]' : 'grid-cols-[260px_1fr]'">
    <app-sidebar [isCollapsed]="isSidebarCollapsed" (onToggle)="toggleSidebar()"></app-sidebar>
    <main class="flex flex-col overflow-y-auto bg-slate-100">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
