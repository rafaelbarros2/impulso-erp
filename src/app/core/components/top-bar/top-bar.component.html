<header class="flex items-center justify-between flex-shrink-0 p-4 bg-white border-b border-slate-200">
  <div class="text-2xl font-bold text-teal-500">
    <span class="font-normal text-slate-800">Impulso</span>ERP
  </div>
  <div class="flex items-center gap-4" *ngIf="currentUser">
    <img class="w-10 h-10 rounded-full" src="https://i.pravatar.cc/150?u={{currentUser.email}}" alt="Foto do utilizador">
    <div class="cursor-pointer" #userMenuTrigger>
      <p class="font-semibold text-slate-800">{{ currentUser.name }}</p>
      <p class="text-sm text-slate-500">{{ currentUser.email }}</p>
    </div>
    <p-button 
      icon="pi pi-angle-down" 
      [text]="true" 
      (click)="userMenu.toggle($event)"
      styleClass="p-button-sm"
    ></p-button>
    <p-menu #userMenu [model]="userMenuItems" [popup]="true"></p-menu>
  </div>
</header>
