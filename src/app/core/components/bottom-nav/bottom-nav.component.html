<nav class="fixed bottom-0 left-0 w-full h-16 bg-white border-t border-slate-200 shadow-lg" style="z-index: 9999;">
    <div class="flex h-full overflow-x-auto scrollbar-hide font-medium">
        <a *ngFor="let item of mobileMenuItems" 
           [routerLink]="item.route"
           routerLinkActive="text-teal-500"
           [routerLinkActiveOptions]="{exact: item.route === '/dashboard'}"
           class="inline-flex flex-col items-center justify-center px-4 min-w-[80px] hover:bg-gray-50 text-slate-500 transition-colors flex-shrink-0">
            <i [class]="'pi ' + item.icon + ' text-xl'"></i>
            <span class="text-xs truncate w-full text-center">{{ item.label }}</span>
        </a>
    </div>
</nav>
